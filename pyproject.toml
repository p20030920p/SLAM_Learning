[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slam-learning"
version = "0.2.0"
description = "Evidence-first experiments on changing maps and semantic localization"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy==1.26.4", "scipy==1.14.1", "matplotlib==3.9.2"]

[project.optional-dependencies]
methods = ["dufomap==1.1.1", "open3d==0.18.0", "fire==0.7.0", "dztimer==1.1.1", "tqdm==4.66.5"]
dev = ["pytest==8.3.3", "ruff==0.7.3"]

[project.scripts]
slam-study = "slam_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
