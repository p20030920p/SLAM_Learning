name: CPU reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_data:
        description: Download 385 MB teaser and run both author methods on Linux
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
      - run: uv sync --project src --frozen --python 3.10 --extra dev --extra audit
      - run: uv run --project src ruff check --config src/pyproject.toml src/slam_learning src/scripts src/tests
      - run: uv run --project src --no-sync deptry src/slam_learning --config src/pyproject.toml
      - run: uv run --project src --no-sync lint-imports --config src/pyproject.toml --no-cache
      - run: uv run --project src --no-sync vulture --config src/pyproject.toml
      - run: uv run --project src pytest -q src/tests
      - run: uv run --project src python src/scripts/evidence/verify_evidence.py
      - run: uv run --project src python src/scripts/evidence/verify_paired_evidence.py
      - run: uv run --project src python src/scripts/evidence/verify_delayed_evidence.py
      - run: uv run --project src python src/scripts/evidence/verify_delayed_support.py
      - run: uv run --project src python src/scripts/evidence/check_docs.py
      - if: runner.os == 'Linux'
        run: bash -n src/launch/reproduce.sh src/scripts/setup/setup_linux.sh src/scripts/run_reproduction.sh src/scripts/setup/setup_semantic.sh src/scripts/setup/setup_hovsg.sh
      - if: runner.os == 'Linux'
        run: bash src/launch/reproduce.sh --help && bash src/scripts/run_reproduction.sh --help
      - if: runner.os == 'Windows'
        run: powershell -NoProfile -File src/launch/reproduce.ps1 -Help
      - run: uv run --project src slam-study run --experiment mechanism
      - run: uv run --project src slam-study run --experiment evidence-stress
      - run: uv run --project src slam-study report --runs results/runs --output results/ci-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: core-evidence-${{ matrix.os }}
          path: results/runs/
  author-methods:
    if: (github.event_name == 'workflow_dispatch' && inputs.real_data) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[real-data]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.2'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libgomp1 libglib2.0-0
      - run: uv sync --project src --frozen --python 3.10 --extra methods --extra dev
      - run: uv run --project src slam-study fetch
      - run: uv run --project src slam-study run --method dufomap
      - run: uv run --project src slam-study run --method beautymap
      - run: uv run --project src slam-study run --experiment pose-stress
      - run: uv run --project src slam-study report --runs results/runs --output results/linux-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-author-evidence
          path: |
            results/runs/**/record.json
            results/runs/**/metrics.json
            results/runs/**/worker.json
            results/runs/**/run.log
            results/runs/**/compatibility.patch
            results/runs/**/summary.json
            results/runs/**/*.csv
            results/runs/**/*.png
            results/linux-report.md
  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file src/docker/Dockerfile --tag slam-learning-ci .
      - run: docker run --rm slam-learning-ci doctor
      - run: docker run --rm --entrypoint python slam-learning-ci -c "import open3d; print(open3d.__version__)"
      - run: docker run --rm slam-learning-ci run --experiment mechanism
